services:
  - type: web
    name: fina
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fina-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: fina-db
    plan: free
    databaseName: fina
    user: fina
