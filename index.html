<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fina • Controle Financeiro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5ff;font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.secondary{background:#26364d}.danger{background:#a9253d}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#0f1c2d;border:1px solid #20334e;border-radius:18px;padding:28px;box-shadow:0 20px 70px #0008}.auth .card{width:min(430px,100%)}h1{margin:0 0 7px}.muted{color:#91a4bd}.field{display:grid;gap:7px;margin:13px 0}.field input,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid #2b3f5a;background:#091526;color:#fff}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{background:#0f1c2d;border:1px solid #20334e;border-radius:15px;padding:18px}.metric b{display:block;font-size:25px;margin-top:8px}.green{color:#43d18a}.red{color:#ff6b7d}.yellow{color:#ffd166}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.panel{background:#0f1c2d;border:1px solid #20334e;border-radius:15px;padding:18px;overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #20334e;white-space:nowrap}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px}.modal .card{width:min(570px,100%)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.wrap{padding:14px}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body>
<section id="auth" class="auth"><div class="card"><h1>FINA</h1><p class="muted">Seu controle financeiro online.</p>
<div id="login"><div class="field"><label>Usuário</label><input id="lu" autocomplete="username"></div><div class="field"><label>Senha</label><input id="lp" type="password" autocomplete="current-password"></div><button onclick="login()">Entrar</button><button class="secondary" onclick="showReg()">Criar conta</button></div>
<div id="reg" class="hidden"><div class="field"><label>Usuário</label><input id="ru"></div><div class="field"><label>Senha</label><input id="rp" type="password"></div><div class="field"><label>Confirmar senha</label><input id="rc" type="password"></div><button onclick="register()">Criar conta</button><button class="secondary" onclick="showLogin()">Voltar</button></div><p id="msg" class="muted"></p></div></section>
<section id="app" class="hidden"><div class="wrap"><div class="top"><div><h1>FINA</h1><span class="muted">Olá, <span id="user"></span></span></div><button class="secondary" onclick="logout()">Sair</button></div>
<div class="grid"><div class="metric">Saldo<b id="saldo">R$ 0,00</b></div><div class="metric">Entradas<b class="green" id="ent">R$ 0,00</b></div><div class="metric">Saídas<b class="red" id="sai">R$ 0,00</b></div><div class="metric">A receber<b class="yellow" id="pend">R$ 0,00</b></div></div>
<div class="actions"><button onclick="openModal()">+ Nova movimentação</button><button class="secondary" onclick="load()">Atualizar</button></div>
<div class="panel"><h2>Histórico</h2><table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Parcelas</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
<div id="modal" class="modal hidden"><div class="card"><h2>Nova movimentação</h2><div class="row"><div class="field"><label>Tipo</label><select id="type"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></div><div class="field"><label>Categoria</label><select id="cat"><option>Serviço fixo</option><option>Manutenção de computador</option><option>Manutenção de portão</option><option>Outros serviços</option><option>Comida</option><option>Contas</option><option>Assinaturas</option><option>Jogos</option><option>Transporte</option><option>Materiais</option><option>Outros</option></select></div></div>
<div class="row"><div class="field"><label>Descrição</label><input id="desc"></div><div class="field"><label>Cliente</label><input id="client"></div></div><div class="row"><div class="field"><label>Valor total</label><input id="amount" type="number" step="0.01" min="0"></div><div class="field"><label>Parcelas</label><input id="parts" type="number" min="1" value="1"></div></div><div class="row"><div class="field"><label>Primeiro vencimento</label><input id="date" type="date"></div><div class="field"><label>Status</label><select id="status"><option value="recebido">Recebido/Pago</option><option value="pendente">Pendente</option></select></div></div><button onclick="saveMove()">Salvar</button><button class="secondary" onclick="closeModal()">Cancelar</button></div></div>
<script>
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}
function msg(x){$('msg').textContent=x}function showReg(){$('login').classList.add('hidden');$('reg').classList.remove('hidden');msg('')}function showLogin(){$('reg').classList.add('hidden');$('login').classList.remove('hidden');msg('')}
async function register(){const u=$('ru').value.trim(),p=$('rp').value,c=$('rc').value;if(p!==c)return msg('As senhas não conferem');try{const d=await api('/api/register',{method:'POST',body:JSON.stringify({username:u,password:p})});openApp(d.username)}catch(e){msg(e.message)}}
async function login(){try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('lu').value.trim(),password:$('lp').value})});openApp(d.username)}catch(e){msg(e.message)}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}function openApp(u){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent=u;load()}
async function load(){const ms=await api('/api/movements');const en=ms.filter(m=>m.type==='entrada').reduce((a,m)=>a+m.value,0),sa=ms.filter(m=>m.type==='saida').reduce((a,m)=>a+m.value,0),pe=ms.filter(m=>m.status==='pendente').reduce((a,m)=>a+m.value,0);$('ent').textContent=money(en);$('sai').textContent=money(sa);$('saldo').textContent=money(en-sa);$('pend').textContent=money(pe);$('rows').innerHTML=ms.map(m=>'<tr><td>'+m.date+'</td><td>'+m.type+'</td><td>'+m.cat+'</td><td>'+((m.desc||'-')+(m.client?' · '+m.client:''))+'</td><td>'+m.part+'/'+m.totalParts+'</td><td>'+money(m.value)+'</td><td>'+m.status+'</td><td><button class="danger" onclick="del('+m.id+')">Excluir</button></td></tr>').join('')||'<tr><td colspan="8" class="muted">Nenhuma movimentação.</td></tr>'}
function openModal(){$('modal').classList.remove('hidden');$('date').value=new Date().toISOString().slice(0,10)}function closeModal(){$('modal').classList.add('hidden')}
async function saveMove(){try{await api('/api/movements',{method:'POST',body:JSON.stringify({type:$('type').value,cat:$('cat').value,desc:$('desc').value,client:$('client').value,amount:$('amount').value,parts:$('parts').value,date:$('date').value,status:$('status').value})});closeModal();load()}catch(e){alert(e.message)}}
async function del(id){if(confirm('Excluir esta movimentação?')){await api('/api/movements/'+id,{method:'DELETE'});load()}}
(async()=>{try{const d=await api('/api/me');if(d.authenticated)openApp(d.username)}catch(e){console.error(e)}})();
</script></body></html>
